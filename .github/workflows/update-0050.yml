name: Update 0050 data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/update-0050.mjs

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update 0050 monthly price data from Yahoo Finance'
          file_pattern: public/data/0050-monthly.json
